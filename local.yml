---
- name: Arch Linux Setup
  hosts: localhost
  become: true

  vars:
    # Change this to your actual system username
    target_user: "haji_amzar"

  vars_files:
    - vars/flatpak_vars.yml

  tasks:
    - name: Load OS-specific variables
      include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ ansible_os_family }}.yml"
            - "default.yml"
          paths:
            - "vars"

    - name: Enable multilib repository in pacman.conf
      ini_file:
        path: /etc/pacman.conf
        section: multilib
        option: Include
        value: /etc/pacman.d/mirrorlist
        state: present
      register: multilib_enabled

    - name: Synchronize pacman package databases
      pacman:
        update_cache: yes
      when: multilib_enabled.changed

    # Install Packages
    - name: Install system utilities and core applications
      package:
        name: "{{ system_packages }}"
        state: present

    - name: Ensure greeter group exists
      group:
        name: greeter
        state: present
        system: true

    - name: Ensure greeter user exists
      user:
        name: greeter
        group: greeter
        system: true
        shell: /usr/bin/nologin
        home: /var/lib/noctalia-greeter
        create_home: false
        state: present

    - name: Create noctalia-greeter state directory
      file:
        path: /var/lib/noctalia-greeter
        state: directory
        owner: greeter
        group: greeter
        mode: '0750'

    - name: Write configuration for noctalia-greeter
      copy:
        dest: /var/lib/noctalia-greeter/greeter.toml
        owner: greeter
        group: greeter
        mode: '0644'
        content: |
          [cursor]
          theme = "Simp1e-Gruvbox-Dark"
          size = 24

    - name: Write greetd configuration file for noctalia-greeter
      copy:
        dest: /etc/greetd/config.toml
        content: |
          [terminal]
          vt = 1

          [default_session]
          command = "/usr/bin/noctalia-greeter-session"
          user = "greeter"

    - name: Ensure /etc/udisks2 directory exists
      file:
        path: /etc/udisks2
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure udisks2 default mount options
      copy:
        dest: /etc/udisks2/mount_options.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [defaults]
          btrfs_defaults=compress=zstd
          defaults=noatime

    - name: Enable and start core system and networking services
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - greetd
        - NetworkManager

    - name: Install GNU Stow for dotfiles management
      package:
        name: stow
        state: present

    - name: Clone or update dotfiles repository (as target user)
      git:
        repo: 'https://github.com/hajiamzar/dotfiles.git' # Replace with your actual repo URL
        dest: "/home/{{ target_user }}/.dotfiles"
        accept_hostkey: true
        update: true
      become: true
      become_user: "{{ target_user }}"

    - name: Check if dotfiles packages exist in repository
      stat:
        path: "/home/{{ target_user }}/.dotfiles/{{ item }}"
      loop:
        - btop
        - gtk
        - kitty
        - mime
        - mousepad
        - noctalia
        - nwg-look
        - qt5ct
        - qt6ct
        - systemd
        - thunar
        - umbriel
        - xsettingsd
        - zed

      register: dotfiles_check
      become: true
      become_user: "{{ target_user }}"

    - name: Stow dotfiles configurations into ~/.config (as target user)
      command: >
        stow -d "/home/{{ target_user }}/.dotfiles"
             -t "/home/{{ target_user }}/.config"
             "{{ item.item }}"
      loop: "{{ dotfiles_check.results }}"
      when: item.stat.exists
      become: true
      become_user: "{{ target_user }}"

    - name: Add Flathub repository (System-wide)
      community.general.flatpak_remote:
        name: flathub
        state: present
        method: system
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

    - name: Install specified Flatpak packages
      community.general.flatpak:
        name: "{{ item }}"
        state: present
        method: system
      loop: "{{ flatpak_packages }}"
      become: true
